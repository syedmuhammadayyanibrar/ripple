- id: "adv_01_union_all_set_operation"
  difficulty: "hard"
  description: "UNION ALL combining regional tables into unified table"
  queries:
    - target_table: "all_orders"
      sql: "SELECT id, amount FROM orders_eu UNION ALL SELECT id, amount FROM orders_us"
  target_change: "table:orders_eu.amount"
  expected_blast_radius:
    - "table:all_orders.amount"

- id: "adv_02_correlated_subquery"
  difficulty: "hard"
  description: "Scalar subquery correlating inner and outer rows on user_id"
  queries:
    - target_table: "orders_with_max"
      sql: "SELECT o1.order_id, (SELECT max(o2.amount) FROM raw_orders o2 WHERE o2.user_id = o1.user_id) AS max_user_order FROM raw_orders o1"
  target_change: "table:raw_orders.user_id"
  expected_blast_radius:
    - "table:orders_with_max.max_user_order"

- id: "adv_03_window_function_over"
  difficulty: "hard"
  description: "ROW_NUMBER ranking partitioned by user and ordered by created_at"
  queries:
    - target_table: "ranked_orders"
      sql: "SELECT order_id, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) AS row_num FROM raw_orders"
  target_change: "table:raw_orders.created_at"
  expected_blast_radius:
    - "table:ranked_orders.row_num"

- id: "adv_04_recursive_cte"
  difficulty: "hard"
  description: "Recursive CTE computing organizational tree hierarchy depth"
  queries:
    - target_table: "final_org"
      sql: |
        WITH RECURSIVE org_chart AS (
          SELECT emp_id, manager_id, 1 AS depth FROM employees WHERE manager_id IS NULL
          UNION ALL
          SELECT e.emp_id, e.manager_id, o.depth + 1 FROM employees e JOIN org_chart o ON e.manager_id = o.emp_id
        )
        SELECT emp_id, depth FROM org_chart
  target_change: "table:employees.manager_id"
  expected_blast_radius:
    - "table:final_org.depth"

- id: "adv_05_lateral_subquery"
  difficulty: "hard"
  description: "Cross-join lateral subquery fetching user recent score"
  queries:
    - target_table: "user_summary"
      sql: "SELECT u.id, l.recent_score FROM raw_users u, LATERAL (SELECT score AS recent_score FROM user_scores s WHERE s.user_id = u.id) l"
  target_change: "table:user_scores.score"
  expected_blast_radius:
    - "table:user_summary.recent_score"

- id: "adv_06_case_scalar_subquery"
  difficulty: "hard"
  description: "Conditional CASE with scalar subquery computing discount applicability"
  queries:
    - target_table: "discounted_orders"
      sql: "SELECT o.order_id, CASE WHEN (SELECT sum(d.discount_amount) FROM discounts d WHERE d.order_id = o.order_id) > 10 THEN 1 ELSE 0 END AS high_discount FROM raw_orders o"
  target_change: "table:discounts.discount_amount"
  expected_blast_radius:
    - "table:discounted_orders.high_discount"

- id: "adv_07_exists_subquery_predicate"
  difficulty: "hard"
  description: "Subquery expression inside EXISTS check for active user status"
  queries:
    - target_table: "active_user_flags"
      sql: "SELECT u.id, EXISTS(SELECT 1 FROM user_logins l WHERE l.user_id = u.id) AS is_active FROM raw_users u"
  target_change: "table:user_logins.user_id"
  expected_blast_radius:
    - "table:active_user_flags.is_active"

